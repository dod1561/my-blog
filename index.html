<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 블로그</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fdfdfc">

  <!-- 테마 깜빡임 방지: CSS보다 먼저 저장된 테마를 적용한다 -->
  <script>
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) { /* 저장소 접근 불가 시 시스템 설정을 따른다 */ }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/post.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="#/">나의 블로그</a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a class="site-nav__link" href="#/">글 목록</a>
        <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
          <!-- 라이트 모드일 때 보이는 달 아이콘 -->
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <!-- 다크 모드일 때 보이는 해 아이콘 -->
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </g>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="container site-main" tabindex="-1">
    <noscript>이 블로그는 JavaScript가 켜져 있어야 글을 볼 수 있습니다.</noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span class="site-footer__year"></span> 나의 블로그 · 마크다운으로 작성했습니다.</p>
    </div>
  </footer>
</body>
</html>
